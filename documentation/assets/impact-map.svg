  @keyframes badgeIn { 0%, 38% { opacity: 0 } 41%, 88% { opacity: 1 } 96%, 100% { opacity: 0 } }
  .dimmed { animation: dim 9s ease-out infinite; opacity: .45; }
  @keyframes dim { 0%, 42% { opacity: 1 } 46%, 88% { opacity: .45 } 96%, 100% { opacity: 1 } }
  .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 0; }
  .edge.l1 { stroke: #8B5CF6; animation: e1 9s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
  .edge.l1t { stroke: #34D399; animation: e1 9s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
