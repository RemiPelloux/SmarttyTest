<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="t d">
  <title id="t">SmartTest — Understand the change. Test what matters.</title>
  <desc id="d">A code change ripples through a dependency graph; only the three tests connected to it light up green, the unrelated tests stay dimmed and are skipped.</desc>
  <style>
  .t-sans { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
  .t-mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; }
  .edge-cold { stroke: #22305C; stroke-width: 1.5; fill: none; }
  .edge-hot { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 0; }
  .edge-hot.l1 { stroke: #FBBF24; animation: draw1 7s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
  .edge-hot.l2 { stroke: #34D399; animation: draw2 7s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
  @keyframes draw1 { 0%, 8% { stroke-dashoffset: 1; opacity: 1 } 22%, 86% { stroke-dashoffset: 0; opacity: 1 } 95%, 100% { stroke-dashoffset: 0; opacity: 0 } }
  @keyframes draw2 { 0%, 26% { stroke-dashoffset: 1; opacity: 1 } 40%, 86% { stroke-dashoffset: 0; opacity: 1 } 95%, 100% { stroke-dashoffset: 0; opacity: 0 } }

  .node { fill: #111A38; stroke: #56618A; stroke-width: 1.5; }
  .node.cold { opacity: 0.55; }
  .node.l1 { fill: #8B5CF6; stroke: #8B5CF6; animation: lit1 7s ease-out infinite; }
  .node.l2 { fill: #34D399; stroke: #34D399; animation: lit2 7s ease-out infinite; }
  @keyframes lit1 { 0%, 20% { fill: #111A38; stroke: #56618A } 23%, 86% { fill: #8B5CF6; stroke: #8B5CF6 } 95%, 100% { fill: #111A38; stroke: #56618A } }
  @keyframes lit2 { 0%, 38% { fill: #111A38; stroke: #56618A } 41%, 86% { fill: #34D399; stroke: #34D399 } 95%, 100% { fill: #111A38; stroke: #56618A } }

  .src-core { fill: #FBBF24; }
  .ripple { fill: none; stroke: #FBBF24; stroke-width: 2; transform-box: fill-box; transform-origin: center; opacity: 0; animation: ripple 3.5s ease-out infinite; }
  .ripple.r2 { animation-delay: 1.75s; }
  @keyframes ripple { 0% { transform: scale(1); opacity: 0.7 } 100% { transform: scale(4.2); opacity: 0 } }

  .check { fill: none; stroke: #070B18; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; animation: lit2check 7s ease-out infinite; }
  @keyframes lit2check { 0%, 40% { opacity: 0 } 43%, 86% { opacity: 1 } 95%, 100% { opacity: 0 } }

  .skip-tag { animation: skipTag 7s ease-out infinite; }
  @keyframes skipTag { 0%, 44% { opacity: 0 } 49%, 86% { opacity: 1 } 95%, 100% { opacity: 0 } }

  .reveal { opacity: 1; animation: reveal 1.2s cubic-bezier(0.22, 1, 0.36, 1) both; }
  .reveal.d1 { animation-delay: .15s } .reveal.d2 { animation-delay: .3s } .reveal.d3 { animation-delay: .45s }
  @keyframes reveal { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }

  .scan { animation: scan 7s linear infinite; }
  @keyframes scan { 0% { transform: translateX(-200px); opacity: 0 } 6% { opacity: .9 } 30% { opacity: .9 } 40%, 100% { transform: translateX(560px); opacity: 0 } }
  
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
  }</style>
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B18"/>
      <stop offset="1" stop-color="#0E1530"/>
    </linearGradient>
    <linearGradient id="hero-brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <pattern id="hero-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="hero-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="hero-halo" cx="0.75" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hero-scan" x1="0" x2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  
  <rect width="1280" height="440" rx="24" fill="url(#hero-bg)"/>
  <rect width="1280" height="440" rx="24" fill="url(#hero-grid)"/>
  <rect x="0.5" y="0.5" width="1279" height="439" rx="24" fill="none" stroke="#22305C"/>
  <rect width="1280" height="440" rx="24" fill="url(#hero-halo)"/>

  <g class="reveal">
  <g transform="translate(72 92) scale(0.875)">
    <rect width="64" height="64" rx="16" fill="url(#hero-brand)"/>
    <path d="M17 34 L28 45 L48 21" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.95"/>
    <circle cx="17" cy="34" r="5" fill="#fff"/>
    <circle cx="28" cy="45" r="5" fill="#fff"/>
    <circle cx="48" cy="21" r="6" fill="#fff"/>
    <circle cx="48" cy="21" r="2.5" fill="#8B5CF6"/>
  </g></g>
  <text x="144" y="138" class="t-sans reveal" font-size="54" font-weight="800" letter-spacing="-1.5" fill="#E8ECF8">SmartTest</text>
  <text x="72" y="214" class="t-sans reveal d1" font-size="30" font-weight="700" letter-spacing="-0.5" fill="#E8ECF8">Understand the change.</text>
  <text x="72" y="252" class="t-sans reveal d1" font-size="30" font-weight="700" letter-spacing="-0.5" fill="url(#hero-brand)">Test what matters.</text>
  <text x="72" y="290" class="t-sans reveal d2" font-size="16" fill="#8C97BD">Semantic test-impact analysis for TypeScript &amp; JavaScript.</text>
  <g class="reveal d3">
    <g transform="translate(72 318)"><rect width="118.19999999999999" height="30" rx="15" fill="#ffffff" fill-opacity="0.04" stroke="#22305C"/><text x="59.099999999999994" y="20" text-anchor="middle" class="t-sans" font-size="13" fill="#8C97BD">Local-first</text></g>
    <g transform="translate(200.2 318)"><rect width="175.6" height="30" rx="15" fill="#ffffff" fill-opacity="0.04" stroke="#22305C"/><text x="87.8" y="20" text-anchor="middle" class="t-sans" font-size="13" fill="#8C97BD">Deterministic core</text></g>
    <g transform="translate(385.79999999999995 318)"><rect width="118.19999999999999" height="30" rx="15" fill="#ffffff" fill-opacity="0.04" stroke="#22305C"/><text x="59.099999999999994" y="20" text-anchor="middle" class="t-sans" font-size="13" fill="#8C97BD">AI-optional</text></g>
    <g transform="translate(514 318)"><rect width="118.19999999999999" height="30" rx="15" fill="#ffffff" fill-opacity="0.04" stroke="#22305C"/><text x="59.099999999999994" y="20" text-anchor="middle" class="t-sans" font-size="13" fill="#8C97BD">Explainable</text></g>
  </g>
  <text x="72" y="392" class="t-mono reveal d3" font-size="14" fill="#56618A"><tspan fill="#22D3EE">$</tspan> npx smarttest run --affected</text>

  <g>
    <rect class="scan" x="640" y="20" width="120" height="400" fill="url(#hero-scan)" opacity="0"/>
    <path class="edge-cold" d="M830 80 C875 80 875 120 920 120"/>
    <path class="edge-cold" d="M1010 40 C1050 40 1050 90 1090 90"/>
    <path class="edge-cold" d="M1010 395 C955 395 955 345 900 345"/>
    <path class="edge-cold" d="M830 80 C920 80 920 40 1010 40"/>
    <path class="edge-cold" d="M1180 140 C1095 140 1095 40 1010 40"/>
    <path class="edge-cold" d="M1190 270 C1100 270 1100 395 1010 395"/>
    <path class="edge-cold" d="M1175 380 C1092.5 380 1092.5 395 1010 395"/>
    <path class="edge-cold" d="M935 240 C1062.5 240 1062.5 270 1190 270"/>
    <path class="edge-cold" d="M790 220 C855 220 855 120 920 120"/>
    <path class="edge-cold" d="M790 220 C862.5 220 862.5 240 935 240"/>
    <path class="edge-cold" d="M790 220 C845 220 845 345 900 345"/>
    <path class="edge-cold" d="M920 120 C1005 120 1005 90 1090 90"/>
    <path class="edge-cold" d="M935 240 C1022.5 240 1022.5 200 1110 200"/>
    <path class="edge-cold" d="M900 345 C997.5 345 997.5 320 1095 320"/>
    <path class="edge-hot l1" pathLength="1" d="M790 220 C855 220 855 120 920 120"/>
    <path class="edge-hot l1" pathLength="1" d="M790 220 C862.5 220 862.5 240 935 240"/>
    <path class="edge-hot l1" pathLength="1" d="M790 220 C845 220 845 345 900 345"/>
    <path class="edge-hot l2" pathLength="1" d="M920 120 C1005 120 1005 90 1090 90"/>
    <path class="edge-hot l2" pathLength="1" d="M935 240 C1022.5 240 1022.5 200 1110 200"/>
    <path class="edge-hot l2" pathLength="1" d="M900 345 C997.5 345 997.5 320 1095 320"/>
    <circle class="ripple" cx="790" cy="220" r="11"/><circle class="ripple r2" cx="790" cy="220" r="11"/><circle class="src-core" cx="790" cy="220" r="11" filter="url(#hero-glow)"/>
    <circle class="node l1" cx="920" cy="120" r="8"/>
    <circle class="node l1" cx="935" cy="240" r="8"/>
    <circle class="node l1" cx="900" cy="345" r="8"/>
    <rect class="node l2" x="1081" y="81" width="18" height="18" rx="4"/><path class="check" d="M1086 90 l3 3 l5 -6"/>
    <rect class="node l2" x="1101" y="191" width="18" height="18" rx="4"/><path class="check" d="M1106 200 l3 3 l5 -6"/>
    <rect class="node l2" x="1086" y="311" width="18" height="18" rx="4"/><path class="check" d="M1091 320 l3 3 l5 -6"/>
    <circle class="node cold" cx="830" cy="80" r="6"/>
    <circle class="node cold" cx="1010" cy="395" r="6"/>
    <rect class="node cold" x="1173" y="133" width="14" height="14" rx="4"/>
    <rect class="node cold" x="1183" y="263" width="14" height="14" rx="4"/>
    <rect class="node cold" x="1168" y="373" width="14" height="14" rx="4"/>
    <circle class="node cold" cx="1010" cy="40" r="5"/>
    <g class="skip-tag t-mono" font-size="11" fill="#56618A">
      <text x="1180" y="168" text-anchor="middle">skipped</text>
      <text x="1190" y="298" text-anchor="middle">skipped</text>
      <text x="1175" y="408" text-anchor="middle">skipped</text>
    </g>
    <g class="t-mono" font-size="11" fill="#8C97BD">
      <text x="790" y="256" text-anchor="middle" fill="#FBBF24">changed</text>
      <text x="1110" y="226" text-anchor="middle" fill="#34D399" class="skip-tag">selected</text>
    </g>
  </g>
</svg>
