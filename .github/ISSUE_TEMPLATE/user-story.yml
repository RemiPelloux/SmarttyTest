name: User story
description: A backlog item written from a user's perspective
title: "ST-___ "
labels: ["story"]
body:
  - type: input
    id: epic
    attributes: { label: Epic, placeholder: "IMP — Impact Engine & Selection" }
    validations: { required: true }
  - type: textarea
    id: story
    attributes:
      label: User story
      value: "As a …, I want …, so that …."
    validations: { required: true }
  - type: textarea
    id: ac
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] Given …, when …, then …
    validations: { required: true }
  - type: dropdown
    id: priority
    attributes: { label: Priority, options: [Must, Should, Could] }
  - type: dropdown
    id: points
    attributes: { label: Story points, options: ["1", "2", "3", "5", "8"] }
  - type: input
    id: refs
    attributes: { label: Spec references, placeholder: "§11.4, G05" }
  - type: input
    id: deps
    attributes: { label: Depends on, placeholder: "ST-056, ST-065" }
