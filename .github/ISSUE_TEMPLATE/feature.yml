name: Feature request
description: Suggest an idea
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: "What are you trying to do, and what's in the way?" }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposal }
  - type: input
    id: spec
    attributes: { label: Related spec section (optional), placeholder: "§24 Studio" }
