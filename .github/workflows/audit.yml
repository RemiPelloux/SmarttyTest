name: Nightly audit

# `smarttest audit` on every fixture that needs no browser: fault injection (one function at a
# time made to throw), reachability of every file a test loads, and import resolution against
# the TypeScript compiler. A missed test, an unreachable file or a mismatched import fails it.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      mutants:
        description: Functions to break per fixture
        default: "20"

permissions:
  contents: read

jobs:
  audit:
    name: audit (fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4 # version from package.json#packageManager
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, fileinfo
          tools: composer
          coverage: none
      - run: composer install --no-interaction --no-progress
        working-directory: fixtures/projects/php-phpunit
      - run: composer install --no-interaction --no-progress
        working-directory: fixtures/projects/php-laravel
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm audit:fixtures
        env:
          AUDIT_MUTANTS: ${{ inputs.mutants || '20' }}
          SMARTTEST_PYTHON: python
          SMARTTEST_PHP: php
