name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version from package.json#packageManager
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Some tests run the compiled CLI and core (packages/*/dist), as they do locally.
      - run: pnpm build
      - run: pnpm verify

  cypress:
    # The Cypress adapter against a real Cypress (fixtures/projects/cypress-e2e). `pnpm install`
    # does not download Cypress's binary (pnpm-workspace.yaml#allowBuilds); this job does.
    name: cypress (real install)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('fixtures/projects/cypress-e2e/package.json') }}
      - run: pnpm --dir fixtures/projects/cypress-e2e exec cypress install
      - run: pnpm --dir fixtures/projects/cypress-e2e exec cypress verify
      - run: pnpm vitest run integration-tests/cypress-real.test.ts
        env:
          SMARTTEST_REAL_CYPRESS: "1"

  angular:
    # The Angular adapter against a real Angular CLI workspace (fixtures/projects/angular-cli). The
    # fixture is outside the pnpm workspace; this job installs it with npm.
    name: angular (real install)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm ci --prefix fixtures/projects/angular-cli --no-audit --no-fund
      - run: pnpm vitest run integration-tests/angular-real.test.ts
        env:
          SMARTTEST_REAL_ANGULAR: "1"

  python:
    # The Python preview against real pytest and unittest (fixtures/projects/python-*), on
    # Linux and Windows. Without a Python that has pytest these tests are skipped elsewhere.
    name: python (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm vitest run integration-tests/python.test.ts packages/language-python packages/adapter-python
        env:
          SMARTTEST_PYTHON: python

  extension:
    name: extension (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # Keep fixtures byte-identical to the repository (no CRLF conversion on Windows).
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The real-host test runs this repository's CLI (packages/cli/dist/bin.js).
      - run: pnpm build
      - run: pnpm --filter smarttest-vscode typecheck
      - run: pnpm --filter smarttest-vscode test
      - uses: actions/cache@v4
        with:
          path: extensions/vscode/.vscode-test
          # The pinned VS Code version lives in the launcher.
          key: vscode-test-${{ runner.os }}-${{ hashFiles('extensions/vscode/scripts/test-host.mjs') }}
      - name: Real VS Code host test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter smarttest-vscode test:host
      - name: Real VS Code host test
        if: runner.os != 'Linux'
        run: pnpm --filter smarttest-vscode test:host
